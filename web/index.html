<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moments</title>
<meta name="description" content="Search hours of video by typing what you want to see. The model runs in your browser; nothing is uploaded.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Rubik:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="brand"><h1>Moments</h1><span class="tag mono">type what you want to see</span></div>
  <div class="stats mono" id="stats"></div>
</header>

<nav class="switch" aria-label="Library">
  <button type="button" id="tabDemo" class="on">NASA footage</button>
  <button type="button" id="tabOwn">Your videos</button>
</nav>

<section class="own" id="own" hidden>
  <label class="drop" id="drop">
    <input type="file" id="files" accept="video/*" multiple hidden>
    <b>Drop videos here, or choose files</b>
    <span>Nothing is uploaded. The search model runs in this browser, and your videos never leave your computer.</span>
  </label>
  <div class="own-status mono" id="ownStatus"></div>
  <div class="bar wide" id="indexBar" hidden><i></i></div>
  <button type="button" class="link mono" id="clear" hidden>Forget my library</button>
</section>

<form class="search" id="form" autocomplete="off">
  <input id="q" placeholder="Describe the moment you are looking for" maxlength="200" aria-label="Search">
  <span class="timing mono" id="timing"></span>
</form>
<div class="model mono" id="model"></div>
<div class="chips" id="chips"></div>

<main>
  <section class="player">
    <video id="video" muted playsinline preload="metadata"></video>
    <div class="now">
      <div class="now-title"><b id="nowName">Nothing playing yet</b><span class="mono" id="nowAt"></span></div>
      <div class="timeline"><div class="moment" id="moment" hidden></div><div class="head" id="head" hidden></div></div>
    </div>
  </section>
  <section class="results" id="results"><p class="empty">Results show up here.</p></section>
</main>

<footer class="mono">
  <a href="https://github.com/itayco2/Moments">Open source on GitHub</a>
  <span>NASA footage: public domain, not endorsed by NASA</span>
  <span>Model: EmbeddingGemma 2 by Google DeepMind, Apache 2.0</span>
</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
