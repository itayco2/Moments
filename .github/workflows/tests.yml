name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python on ${{ matrix.os }} (lint and fast tests, no GPU, no model download)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install (torch comes from the CPU index on Linux, cu130 on Windows)
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Tests
        run: uv run --no-sync pytest -q

  web:
    name: web (types, unit tests, golden parity with Python, demo in Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types and build
        run: npm run build
      - name: Unit tests and golden parity
        run: npm test
      - name: Demo in Google Chrome (the own-video test needs the model and runs locally)
        run: npx playwright test demo

  extension:
    name: extension (types, unit tests, build with the no-remote-code check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: extension
      - run: npx tsc --noEmit && npx vitest run --passWithNoTests
        working-directory: extension
      - name: Build (fails if any script in dist names a script CDN)
        run: node build.mjs
        working-directory: extension
